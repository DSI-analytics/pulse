# PostgreSQL for Pulso (production-shaped local/prod database).
# Local dev without Docker can instead use `npm run db:dev` (userland Postgres).
services:
  db:
    image: postgres:16-alpine
    container_name: pulso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "5432:5432"
    volumes:
      - pulso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The application itself. Start everything with:  docker compose up -d
  # (omit this service if you only want the database for local development).
  app:
    build: .
    container_name: pulso-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:pulso@db:5432/pulso?schema=public
      # Generate with: openssl rand -base64 48
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      APP_TZ: Africa/Maputo
      APP_CURRENCY: MZN
      APP_LOCALE: pt
    ports:
      - "3000:3000"

volumes:
  pulso_pgdata:
