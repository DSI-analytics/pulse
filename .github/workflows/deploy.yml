name: Build, test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Empacotar e enviar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=.next \
            -czf "/tmp/pulso-${GITHUB_SHA}.tgz" .

          scp "/tmp/pulso-${GITHUB_SHA}.tgz" \
            "${VPS_USER}@${VPS_HOST}:/tmp/pulso-${GITHUB_SHA}.tgz"

      - name: Publicar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "
            set -eu

            release=/opt/pulso/releases/${GITHUB_SHA}
            mkdir -p \$release
            tar -xzf /tmp/pulso-${GITHUB_SHA}.tgz -C \$release
            cd \$release

            docker compose -p pulso --env-file /opt/pulso/.env up -d db
            docker compose -p pulso --env-file /opt/pulso/.env build app

            docker compose -p pulso --env-file /opt/pulso/.env run --rm app \
              node node_modules/prisma/build/index.js migrate deploy

            docker compose -p pulso --env-file /opt/pulso/.env up -d app

            ln -sfn \$release /opt/pulso/current
            rm /tmp/pulso-${GITHUB_SHA}.tgz

            docker compose -p pulso --env-file /opt/pulso/.env ps
          "